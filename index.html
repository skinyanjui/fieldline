    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Fieldline – Black Outdoor Clubs Directory &amp; Network</title>
    <meta
      name="description"
      content="Discover 42+ Black outdoor clubs, hiking groups, surf & ski crews, and land stewardship organizations. Join clubs, share trail notes, and RSVP to outings."
    />
    <meta name="robots" content="index, follow" />

    <!-- OpenGraph Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fieldline" />
    <meta property="og:title" content="Fieldline – Black Outdoor Clubs Directory & Network" />
    <meta
      property="og:description"
      content="Discover 42+ Black outdoor clubs, hiking groups, surf & ski crews, and land stewardship organizations. Join clubs, share trail notes, and RSVP to outings."
    />
    <meta property="og:image" content="/src/assets/images/hero_trail_community_1795218078083.jpg" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fieldline – Black Outdoor Clubs Directory & Network" />
    <meta
      name="twitter:description"
      content="Discover 42+ Black outdoor clubs, hiking groups, surf & ski crews, and land stewardship organizations. Join clubs, share trail notes, and RSVP to outings."
    />
    <meta name="twitter:image" content="/src/assets/images/hero_trail_community_1795218078083.jpg" />

    <!-- AI / Answer Engine Optimization Discovery Links -->
    <link rel="alternate" type="text/plain" href="/llms.txt" title="Fieldline LLMs Directory Context" />
    <link rel="alternate" type="text/plain" href="/lamd.txt" title="Fieldline AI Directory Context" />

    <!-- Schema.org Structured Data (SEO & AEO JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "Fieldline",
            "applicationCategory": "SocialNetworkingApplication",
            "operatingSystem": "All",
            "description": "Directory and community social network mapping 42+ Black outdoor clubs, adventure collectives, and land stewardship organizations across the United States and diaspora.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What are the largest Black outdoor clubs in the United States?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Major multi-chapter Black outdoor organizations include Outdoor Afro (80+ chapters), GirlTrek (1M+ walkers), Black Girls Do Bike (100+ chapters), Black Girls RUN! (70+ chapters), Black Men Run (50+ chapters), the National Brotherhood of Skiers (50+ clubs), and the National Association of Black Scuba Divers (NABS)."
                }
              },
              {
                "@type": "Question",
                "name": "Which Black outdoor organizations provide loaner gear or beginner instruction?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Blackpackers (Colorado), Wild Diversity (Portland Community Gear Library), Laru Beya Collective (free surf gear and instruction in NYC), EDGE Outdoors (ski and snowboard clinics in the Pacific Northwest), and Soul Trak Outdoors (Washington, D.C.) provide loaner gear, sliding-scale trips, or subsidized instruction."
                }
              },
              {
                "@type": "Question",
                "name": "How can I find Black-owned campgrounds and land stewardship organizations?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Fieldline indexes African-American Owned Campgrounds, Black Folks Camp Too, Soul Fire Farm, Backyard Basecamp (BLISS Meadows), Braided Seeds, Compton Cowboys, and the Federation of Black Cowboys alongside 35+ recreation clubs."
                }
              }
            ]
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <div id="root"></div>
